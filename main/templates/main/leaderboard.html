{% extends 'main/base.html' %}
{% load static %}

{% block title %}Leaderboard - Travel Tribe{% endblock %}

{% block extra_css %}
<style>
  .leaderboard-container {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 80px 20px 40px;
  }

  .leaderboard-header {
    text-align: center;
    color: white;
    margin-bottom: 40px;
  }

  .leaderboard-header h1 {
    font-size: 3rem;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
  }

  .leaderboard-header p {
    font-size: 1.2rem;
    opacity: 0.9;
  }

  .leaderboard-content {
    max-width: 900px;
    margin: 0 auto;
  }

  .user-rank-card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
  }

  .user-rank-card h3 {
    color: #667eea;
    margin-bottom: 15px;
  }

  .rank-badge {
    display: inline-block;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 1.5rem;
    font-weight: bold;
  }

  .top-three {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
  }

  .podium-card {
    background: white;
    border-radius: 15px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    position: relative;
    transition: transform 0.3s;
  }

  .podium-card:hover {
    transform: translateY(-5px);
  }

  .podium-card.first {
    order: 2;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: white;
  }

  .podium-card.second {
    order: 1;
    background: linear-gradient(135deg, #C0C0C0, #808080);
    color: white;
  }

  .podium-card.third {
    order: 3;
    background: linear-gradient(135deg, #CD7F32, #8B4513);
    color: white;
  }

  .podium-rank {
    font-size: 3rem;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .podium-username {
    font-size: 1.3rem;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .podium-stats {
    margin-top: 15px;
    font-size: 0.9rem;
  }

  .podium-stats div {
    margin: 5px 0;
  }

  .leaderboard-list {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .leaderboard-item {
    display: flex;
    align-items: center;
    padding: 20px 25px;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.3s;
  }

  .leaderboard-item:hover {
    background: #f8f9ff;
  }

  .leaderboard-item:last-child {
    border-bottom: none;
  }

  .item-rank {
    font-size: 1.5rem;
    font-weight: bold;
    color: #667eea;
    width: 60px;
    text-align: center;
  }

  .item-user {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .user-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
  }

  .user-info h4 {
    margin: 0;
    color: #333;
    font-size: 1.1rem;
  }

  .user-level {
    color: #666;
    font-size: 0.9rem;
  }

  .item-stats {
    display: flex;
    gap: 30px;
    align-items: center;
  }

  .stat-item {
    text-align: center;
  }
