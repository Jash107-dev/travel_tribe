{% load static %}
<!-- AI Travel Assistant Chatbot -->
<div id="chatbot-container" class="chatbot-container" data-perry-img="{% static 'img/perry_chatbot.jpg' %}">
  <div id="chatbot-toggle" class="chatbot-toggle">
    <img src="{% static 'img/perry_chatbot.jpg' %}" alt="AI Assistant" class="chatbot-toggle-img">
    <span class="chatbot-badge">AI</span>
  </div>
  
  <div id="chatbot-window" class="chatbot-window">
    <div class="chatbot-header">
      <div class="chatbot-header-content">
        <div class="chatbot-avatar">
          <img src="{% static 'img/perry_chatbot.jpg' %}" alt="AI Assistant" class="chatbot-avatar-img">
        </div>
        <div class="chatbot-title">
          <h4>Travel Tribe Assistant</h4>
          <span class="chatbot-status">Online</span>
        </div>
      </div>
      <button id="chatbot-close" class="chatbot-close">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div id="chatbot-messages" class="chatbot-messages">
      <div class="chatbot-message bot-message">
        <div class="message-avatar">
          <img src="{% static 'img/perry_chatbot.jpg' %}" alt="AI Assistant" class="message-avatar-img">
        </div>
        <div class="message-content">
          <p>👋 Hi! I'm your Travel Tribe Assistant. I can help you with:</p>
          <ul>
            <li>🗺️ Finding trips and destinations</li>
            <li>👥 Joining travel tribes</li>
            <li>📅 Trip planning tips</li>
            <li>❓ Answering questions about the platform</li>
          </ul>
          <p>What would you like to know?</p>
        </div>
      </div>
    </div>
    
    <div class="chatbot-quick-actions">
      <button class="quick-action-btn" data-question="What trips are available?">
        <i class="fas fa-map-marked-alt"></i> Available Trips
      </button>
      <button class="quick-action-btn" data-question="How do I join a tribe?">
        <i class="fas fa-users"></i> Join Tribe
      </button>
      <button class="quick-action-btn" data-question="Tell me about popular destinations">
        <i class="fas fa-star"></i> Popular Places
      </button>
    </div>
    
    <div class="chatbot-input-container">
      <input 
        type="text" 
        id="chatbot-input" 
        class="chatbot-input" 
        placeholder="Ask me anything about trips..."
        autocomplete="off"
      />
      <button id="chatbot-send" class="chatbot-send">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>
